<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOBI Hire — Interview Scorecards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e5352b'/%3E%3Ccircle cx='50' cy='50' r='31' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Cpath d='M39 34V66M61 34V66M39 50h22' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e5352b'/%3E%3Ccircle cx='50' cy='50' r='31' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Cpath d='M39 34V66M61 34V66M39 50h22' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg:#f0f0f0; --card:#ffffff; --border:#d4d4d8; --text:#27272a; --text2:#71717a; --text3:#a1a1aa;
    --red:#c81e1e; --red-light:#fbe0e0; --green:#16a34a; --green-light:#e6f7ec;
    --amber:#d97706; --amber-light:#fef3e2; --blue:#2563eb; --blue-light:#e0ecfd;
    --purple:#7c3aed; --purple-light:#efe6fd;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  }
  [data-theme="dark"]{
    --bg:#18181b; --card:#27272a; --border:#3f3f46; --text:#f4f4f5; --text2:#a1a1aa; --text3:#71717a;
    --red:#f87171; --red-light:#3a1515; --green:#34d27a; --green-light:#15301f;
    --amber:#f5a623; --amber-light:#3a2c10; --blue:#60a5fa; --blue-light:#152540;
    --purple:#a78bfa; --purple-light:#241a3a;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; font-family:"Segoe UI",-apple-system,Roboto,"Sarabun","Noto Sans Thai",Arial,sans-serif;}
  html{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  body{margin:0; background:var(--bg); color:var(--text); transition:background-color .2s,color .2s;}
  input::placeholder, textarea::placeholder{color:var(--text3);}
  select{color-scheme:inherit;}
  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{width:220px; background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh;}
  .logo{display:flex; align-items:center; gap:10px; padding:20px 18px; font-weight:700; font-size:18px; letter-spacing:.5px;}
  .brand-mark{width:24px; height:24px; flex-shrink:0; display:block;}
  .nav{display:flex; flex-direction:column; gap:2px; padding:0 10px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:var(--text2); font-size:14px; cursor:pointer; text-decoration:none; user-select:none;}
  .nav-item i{font-size:18px;}
  .nav-item.active{background:var(--red-light); color:var(--red); font-weight:500;}
  .nav-item:hover:not(.active){background:var(--bg);}
  .nav-sep{height:1px; background:var(--border); margin:8px 12px;}
  .sidebar-footer{margin-top:auto; padding:16px 18px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px;}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--red-light); color:var(--red); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;}
  .user-name{font-size:13px; font-weight:500;}
  .user-email{font-size:11px; color:var(--text3);}

  /* Main */
  .main{flex:1; padding:24px 28px; min-width:0;}
  .header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .header h1{font-size:22px; margin:0 0 4px;}
  .header p{margin:0; color:var(--text2); font-size:13px;}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--red); color:#fff; border-color:var(--red);}
  .btn-primary:hover{background:#a81818;}
  .btn-sm{padding:5px 10px; font-size:12px;}

  /* Stats */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .stat-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; align-items:center; gap:12px;}
  .stat-icon{width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .stat-value{font-size:20px; font-weight:600; line-height:1.2;}
  .stat-label{font-size:12px; color:var(--text2);}

  /* Filters */
  .filters{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .search-box{flex:1; min-width:220px; position:relative;}
  .search-box i{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:16px;}
  .search-box input{width:100%; padding:9px 12px 9px 36px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card); color:var(--text);}
  select, .filters input{padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card); color:var(--text); cursor:pointer;}

  /* Candidate list */
  .list{border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card);}
  .list-header{display:grid; grid-template-columns:34px 1fr 150px 130px 90px 110px 90px; gap:12px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--border);}
  .list-header span{font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.06em;}
  .list-header .r{text-align:right;}
  .list-header .c{text-align:center;}
  .cand-row{display:grid; grid-template-columns:34px 1fr 150px 130px 90px 110px 90px; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s;}
  .cand-row:last-child{border-bottom:none;}
  .cand-row:hover{background:var(--bg);}
  .cand-num{font-size:12px; color:var(--text3); text-align:center; font-variant-numeric:tabular-nums;}
  .cand-name{font-size:13px; font-weight:500;}
  .cand-sub{font-size:11px; color:var(--text3); margin-top:1px;}
  .cell{font-size:12px; color:var(--text2);}
  .c{text-align:center;} .r{text-align:right;}

  .score-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;}
  .score-hi{background:var(--green-light); color:var(--green);}
  .score-mid{background:var(--amber-light); color:var(--amber);}
  .score-lo{background:var(--red-light); color:var(--red);}
  .score-na{background:var(--bg); color:var(--text3); font-weight:500;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500;}
  .st-applied{background:var(--bg); color:var(--text2);}
  .st-screening{background:var(--blue-light); color:var(--blue);}
  .st-interview{background:var(--purple-light); color:var(--purple);}
  .st-offer{background:var(--green-light); color:var(--green);}
  .st-hired{background:var(--green); color:#fff;}
  .st-rejected{background:var(--red-light); color:var(--red);}

  .rec-pill{font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;}
  .rec-2{background:var(--green); color:#fff;}
  .rec-1{background:var(--green-light); color:var(--green);}
  .rec--1{background:var(--amber-light); color:var(--amber);}
  .rec--2{background:var(--red-light); color:var(--red);}

  .empty{padding:48px 16px; text-align:center; color:var(--text3); font-size:13px;}
  .empty i{font-size:34px; display:block; margin-bottom:10px; color:var(--border);}

  /* Modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:32px 16px; overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--card); border-radius:14px; width:100%; max-width:640px; box-shadow:var(--shadow); border:1px solid var(--border);}
  .modal-box.wide{max-width:820px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border);}
  .modal-head h2{font-size:17px; margin:0;}
  .modal-head .sub{font-size:12px; color:var(--text3); margin-top:2px;}
  .modal-close{background:none; border:none; font-size:22px; color:var(--text3); cursor:pointer; line-height:1;}
  .modal-body{padding:22px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card); color:var(--text);}
  .field textarea{resize:vertical; min-height:70px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  /* Score rows in scorecard modal */
  .crit-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
  .crit-row:last-of-type{border-bottom:none;}
  .crit-name{font-size:13px; font-weight:500;}
  .crit-hint{font-size:11px; color:var(--text3);}
  .rating{display:flex; gap:5px;}
  .rating button{width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text2); font-size:13px; font-weight:600; cursor:pointer;}
  .rating button.sel{background:var(--red); color:#fff; border-color:var(--red);}
  .rating button:hover:not(.sel){background:var(--bg);}

  .rec-choices{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .rec-choices button{padding:10px 6px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text2); font-size:12px; font-weight:500; cursor:pointer;}
  .rec-choices button.sel{color:#fff;}
  .rec-choices button[data-v="2"].sel{background:var(--green); border-color:var(--green);}
  .rec-choices button[data-v="1"].sel{background:#4ba86a; border-color:#4ba86a;}
  .rec-choices button[data-v="-1"].sel{background:var(--amber); border-color:var(--amber);}
  .rec-choices button[data-v="-2"].sel{background:var(--red); border-color:var(--red);}

  /* Detail view */
  .detail-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; flex-wrap:wrap;}
  .detail-name{font-size:20px; font-weight:600;}
  .detail-meta{font-size:13px; color:var(--text2); margin-top:4px;}
  .detail-big-score{text-align:center; padding:0 8px;}
  .detail-big-score .n{font-size:34px; font-weight:700; line-height:1;}
  .detail-big-score .l{font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; margin-top:4px;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px;}
  .panel h3{font-size:14px; margin:0 0 14px;}

  .crit-bar-row{margin-bottom:14px;}
  .crit-bar-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .crit-bar-top .v{font-weight:600; font-variant-numeric:tabular-nums;}
  .crit-bar{height:8px; border-radius:5px; background:var(--bg); overflow:hidden;}
  .crit-bar span{display:block; height:100%; border-radius:5px; background:var(--red);}

  .sc-card{border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px;}
  .sc-card:last-child{margin-bottom:0;}
  .sc-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px;}
  .sc-who{font-size:13px; font-weight:600;}
  .sc-when{font-size:11px; color:var(--text3);}
  .sc-scores{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .sc-chip{font-size:11px; color:var(--text2); background:var(--bg); border-radius:6px; padding:3px 8px;}
  .sc-chip b{color:var(--text); font-variant-numeric:tabular-nums;}
  .sc-comment{font-size:12px; color:var(--text2); line-height:1.5; margin-top:6px; white-space:pre-wrap;}
  .sc-del{background:none; border:none; color:var(--text3); cursor:pointer; font-size:15px;}
  .sc-del:hover{color:var(--red);}

  .link-btn{background:none; border:none; color:var(--red); font-size:13px; cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:5px;}

  @media(max-width:860px){
    .sidebar{width:64px;} .logo span, .nav-item span:not(#themeLabel), .user-name, .user-email, .logo{font-size:0;}
    .logo .brand-mark{width:26px;height:26px;} .nav-item{justify-content:center;} .nav-item{font-size:0;} .nav-item i{font-size:20px;}
    .stats{grid-template-columns:repeat(2,1fr);} .two-col{grid-template-columns:1fr;}
    .list-header, .cand-row{grid-template-columns:28px 1fr 80px 90px; }
    .list-header .h-pos,.list-header .h-int,.list-header .h-stage,.cand-row .col-pos,.cand-row .col-int,.cand-row .col-stage{display:none;}
    .rec-choices{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#e5352b"/><circle cx="50" cy="50" r="31" fill="none" stroke="#fff" stroke-width="7"/><path d="M39 34V66M61 34V66M39 50h22" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg> <span>HOBI Hire</span></div>
    <div class="nav">
      <div class="nav-item active" data-view="dashboard"><i class="ti ti-layout-dashboard"></i> <span>Dashboard</span></div>
      <div class="nav-item" data-view="candidates"><i class="ti ti-users"></i> <span>ผู้สมัคร</span></div>
      <div class="nav-sep"></div>
      <div class="nav-item" id="themeToggle"><i class="ti ti-moon" id="themeIcon"></i> <span id="themeLabel">Dark mode</span></div>
    </div>
    <div class="sidebar-footer">
      <div class="avatar">HR</div>
      <div>
        <div class="user-name">HOBI Recruiting</div>
        <div class="user-email">Interview Scorecards</div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">ภาพรวมคะแนนสัมภาษณ์ผู้สมัครทั้งหมด</p>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
        <button class="btn btn-primary" onclick="openCandidateModal()"><i class="ti ti-user-plus"></i> เพิ่มผู้สมัคร</button>
      </div>
    </div>

    <!-- Dashboard view -->
    <div id="view-dashboard">
      <div class="stats" id="dashStats"></div>
      <div class="panel">
        <h3><i class="ti ti-trophy" style="color:var(--amber)"></i> ผู้สมัครคะแนนสูงสุด (Top candidates)</h3>
        <div id="dashTop"></div>
      </div>
    </div>

    <!-- Candidates view -->
    <div id="view-candidates" style="display:none;">
      <div class="filters">
        <div class="search-box"><i class="ti ti-search"></i><input id="searchInput" placeholder="ค้นหาชื่อ / ตำแหน่ง..." oninput="renderCandidates()"></div>
        <select id="filterStage" onchange="renderCandidates()">
          <option value="">ทุกสถานะ</option>
          <option value="applied">Applied</option>
          <option value="screening">Screening</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="hired">Hired</option>
          <option value="rejected">Rejected</option>
        </select>
        <select id="filterSort" onchange="renderCandidates()">
          <option value="score">เรียงตามคะแนนสูงสุด</option>
          <option value="name">เรียงตามชื่อ</option>
          <option value="recent">เรียงตามล่าสุด</option>
        </select>
      </div>
      <div class="list">
        <div class="list-header">
          <span class="c">#</span><span>ผู้สมัคร</span><span class="h-pos">ตำแหน่ง</span>
          <span class="h-stage">สถานะ</span><span class="c h-int">สัมภาษณ์</span>
          <span class="c">คะแนนเฉลี่ย</span><span class="c">คำแนะนำ</span>
        </div>
        <div id="candList"></div>
      </div>
    </div>

    <!-- Detail view -->
    <div id="view-detail" style="display:none;"></div>
  </div>
</div>

<!-- Candidate modal -->
<div class="modal-overlay" id="candModal">
  <div class="modal-box">
    <div class="modal-head">
      <div><h2 id="candModalTitle">เพิ่มผู้สมัคร</h2></div>
      <button class="modal-close" onclick="closeModal('candModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="candId">
      <div class="grid2">
        <div class="field"><label>ชื่อ-นามสกุล *</label><input id="fName" placeholder="เช่น สมชาย ใจดี"></div>
        <div class="field"><label>ตำแหน่งที่สมัคร *</label><input id="fPosition" placeholder="เช่น Software Engineer"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>แผนก</label><input id="fDept" placeholder="เช่น Engineering"></div>
        <div class="field"><label>สถานะ</label>
          <select id="fStage">
            <option value="applied">Applied</option>
            <option value="screening">Screening</option>
            <option value="interview" selected>Interview</option>
            <option value="offer">Offer</option>
            <option value="hired">Hired</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>อีเมล</label><input id="fEmail" placeholder="name@email.com"></div>
        <div class="field"><label>เบอร์โทร</label><input id="fPhone" placeholder="08x-xxx-xxxx"></div>
      </div>
      <div class="field"><label>หมายเหตุ</label><textarea id="fNotes" placeholder="ข้อมูลเพิ่มเติม..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('candModal')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveCandidate()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Scorecard modal -->
<div class="modal-overlay" id="scoreModal">
  <div class="modal-box wide">
    <div class="modal-head">
      <div><h2>บันทึกคะแนนสัมภาษณ์</h2><div class="sub" id="scoreModalSub"></div></div>
      <button class="modal-close" onclick="closeModal('scoreModal')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="scCandId">
      <div class="grid2">
        <div class="field"><label>ผู้สัมภาษณ์ *</label><input id="scInterviewer" placeholder="ชื่อผู้ให้คะแนน"></div>
        <div class="field"><label>รอบ / ประเภท</label>
          <select id="scRound">
            <option>HR Screening</option>
            <option selected>Technical Interview</option>
            <option>Culture Fit</option>
            <option>Final Round</option>
            <option>Take-home Review</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label>เกณฑ์การให้คะแนน (1 = ต่ำ, 5 = ดีเยี่ยม)</label>
        <div id="critRows"></div>
      </div>
      <div class="field">
        <label>คำแนะนำ (Recommendation) *</label>
        <div class="rec-choices" id="recChoices">
          <button type="button" data-v="2">Strong Hire</button>
          <button type="button" data-v="1">Hire</button>
          <button type="button" data-v="-1">No Hire</button>
          <button type="button" data-v="-2">Strong No</button>
        </div>
      </div>
      <div class="field"><label>ความเห็น / คอมเมนต์</label><textarea id="scComment" placeholder="จุดเด่น จุดที่ควรพัฒนา ฯลฯ"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('scoreModal')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveScorecard()">บันทึกคะแนน</button>
    </div>
  </div>
</div>

<script>
/* ---------------- Data ---------------- */
const CRITERIA = [

  {key:"problem",    name:"Problem Solving",  hint:"การคิดวิเคราะห์แก้ปัญหา"},

  {key:"experience", name:"Experience",       hint:"ประสบการณ์ที่เกี่ยวข้อง"},

const REC_LABEL = {"2":"Strong Hire","1":"Hire","-1":"No Hire","-2":"Strong No Hire"};

let candidates = load();
let idCounter = 0;
candidates.forEach(c=>{ idCounter=Math.max(idCounter,c.id); (c.scorecards||[]).forEach(s=> idCounter=Math.max(idCounter,s.id)); });

function load(){
  try{
    const raw = localStorage.getItem('hobi_hire');
    if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)) return a; }
  }catch(e){}
  return JSON.parse(JSON.stringify(SAMPLE));
}
function save(){ try{ localStorage.setItem('hobi_hire', JSON.stringify(candidates)); }catch(e){} }
function nextId(){ return ++idCounter; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- Aggregation ---------------- */
function avgScore(c){
  const cards = c.scorecards||[];
  if(!cards.length) return null;
  let sum=0,n=0;
  cards.forEach(s=>{ CRITERIA.forEach(cr=>{ const v=s.scores?.[cr.key]; if(typeof v==='number'){sum+=v;n++;} }); });
  return n? sum/n : null;
}
function critAvgs(c){
  const cards=c.scorecards||[]; const out={};
  CRITERIA.forEach(cr=>{
    let sum=0,n=0;
    cards.forEach(s=>{ const v=s.scores?.[cr.key]; if(typeof v==='number'){sum+=v;n++;} });
    out[cr.key]= n? sum/n : null;
  });
  return out;
}
function recSummary(c){
  const cards=c.scorecards||[];
  if(!cards.length) return null;
  const sum = cards.reduce((a,s)=>a+(s.rec||0),0);
  const avg = sum/cards.length;
  // rec scale is {-2,-1,1,2} (no 0); snap avg to nearest at the midpoints 1.5 / 0 / -1.5
  if(avg>=1.5) return 2; if(avg>=0) return 1; if(avg>=-1.5) return -1; return -2;
}
function scoreClass(v){ if(v==null) return 'score-na'; if(v>=4) return 'score-hi'; if(v>=3) return 'score-mid'; return 'score-lo'; }
function fmtScore(v){ return v==null? '—' : v.toFixed(1); }
function fmtDate(ts){ if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}); }

/* ---------------- Views ---------------- */
function showView(name){
  document.querySelectorAll('.nav-item[data-view]').forEach(i=>i.classList.toggle('active', i.dataset.view===name));
  ['dashboard','candidates','detail'].forEach(v=> document.getElementById('view-'+v).style.display = v===name?'':'none');
  const titles={dashboard:['Dashboard','ภาพรวมคะแนนสัมภาษณ์ผู้สมัครทั้งหมด'],candidates:['ผู้สมัคร','รายชื่อผู้สมัครและคะแนนเฉลี่ย'],detail:['รายละเอียดผู้สมัคร','']};
  if(titles[name]){ document.getElementById('pageTitle').textContent=titles[name][0]; document.getElementById('pageSub').textContent=titles[name][1]; }
  if(name==='dashboard') renderDashboard();
  if(name==='candidates') renderCandidates();
}
document.querySelectorAll('.nav-item[data-view]').forEach(i=> i.onclick=()=>showView(i.dataset.view));

function renderDashboard(){
  const total=candidates.length;
  const totalCards=candidates.reduce((a,c)=>a+(c.scorecards?.length||0),0);
  const scored=candidates.filter(c=>avgScore(c)!=null);
  const overall = scored.length? scored.reduce((a,c)=>a+avgScore(c),0)/scored.length : null;
  const pending = candidates.filter(c=>!(c.scorecards?.length)).length;
  const stats=[
    {icon:'ti-users',color:'blue',v:total,l:'ผู้สมัครทั้งหมด'},
    {icon:'ti-clipboard-check',color:'purple',v:totalCards,l:'ใบให้คะแนน (Scorecards)'},
    {icon:'ti-star',color:'amber',v:fmtScore(overall),l:'คะแนนเฉลี่ยรวม'},
    {icon:'ti-hourglass',color:'red',v:pending,l:'ยังไม่ได้สัมภาษณ์'},
  ];
  document.getElementById('dashStats').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--${s.color}-light);color:var(--${s.color})"><i class="ti ${s.icon}"></i></div>
      <div><div class="stat-value">${s.v}</div><div class="stat-label">${s.l}</div></div>
    </div>`).join('');

  const top=[...scored].sort((a,b)=>avgScore(b)-avgScore(a)).slice(0,5);
  document.getElementById('dashTop').innerHTML = top.length? top.map((c,i)=>{
    const v=avgScore(c); const rec=recSummary(c);
    return `<div class="cand-row" style="grid-template-columns:34px 1fr 150px 110px 90px;" onclick="openDetail(${c.id})">
      <div class="cand-num">${i+1}</div>
      <div><div class="cand-name">${esc(c.name)}</div><div class="cand-sub">${esc(c.position)}</div></div>
      <div class="cell">${esc(c.dept||'')}</div>
      <div class="c">${rec!=null?`<span class="rec-pill rec-${rec}">${REC_LABEL[rec]}</span>`:''}</div>
      <div class="c"><span class="score-pill ${scoreClass(v)}">${fmtScore(v)}</span></div>
    </div>`;
  }).join('') : '<div class="empty"><i class="ti ti-inbox"></i>ยังไม่มีคะแนนสัมภาษณ์</div>';
}

function renderCandidates(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const stage=document.getElementById('filterStage').value;
  const sort=document.getElementById('filterSort').value;
  let list=candidates.filter(c=>{
    if(stage && c.stage!==stage) return false;
    if(q && !(`${c.name} ${c.position} ${c.dept||''}`.toLowerCase().includes(q))) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(sort==='name') return a.name.localeCompare(b.name,'th');
    if(sort==='recent') return (b.createdAt||0)-(a.createdAt||0);
    const va=avgScore(a), vb=avgScore(b);
    return (vb==null?-1:vb)-(va==null?-1:va);
  });
  const el=document.getElementById('candList');
  if(!list.length){ el.innerHTML='<div class="empty"><i class="ti ti-user-search"></i>ไม่พบผู้สมัคร</div>'; return; }
  el.innerHTML=list.map((c,i)=>{
    const v=avgScore(c); const rec=recSummary(c); const n=c.scorecards?.length||0;
    return `<div class="cand-row" onclick="openDetail(${c.id})">
      <div class="cand-num">${i+1}</div>
      <div><div class="cand-name">${esc(c.name)}</div><div class="cand-sub">${esc(c.email||'')}</div></div>
      <div class="cell col-pos">${esc(c.position)}</div>
      <div class="col-stage"><span class="badge st-${c.stage}">${c.stage}</span></div>
      <div class="c cell col-int">${n}</div>
      <div class="c"><span class="score-pill ${scoreClass(v)}">${fmtScore(v)}</span></div>
      <div class="c">${rec!=null?`<span class="rec-pill rec-${rec}">${REC_LABEL[rec].replace('Strong ','S.')}</span>`:'<span class="cell">—</span>'}</div>
    </div>`;
  }).join('');
}

function openDetail(id){
  const c=candidates.find(x=>x.id===id); if(!c) return;
  const v=avgScore(c); const rec=recSummary(c); const cavg=critAvgs(c);
  const cards=[...(c.scorecards||[])].sort((a,b)=>(b.date||0)-(a.date||0));
  const el=document.getElementById('view-detail');
  el.innerHTML=`
    <button class="link-btn" style="margin-bottom:14px" onclick="showView('candidates')"><i class="ti ti-arrow-left"></i> กลับไปรายชื่อ</button>
    <div class="detail-top">
      <div style="flex:1;min-width:200px">
        <div class="detail-name">${esc(c.name)}</div>
        <div class="detail-meta">${esc(c.position)}${c.dept?' · '+esc(c.dept):''} <span class="badge st-${c.stage}" style="margin-left:6px">${c.stage}</span></div>
        <div class="detail-meta" style="margin-top:6px">
          ${c.email?`<i class="ti ti-mail"></i> ${esc(c.email)}&nbsp;&nbsp;`:''}
          ${c.phone?`<i class="ti ti-phone"></i> ${esc(c.phone)}`:''}
        </div>
        ${c.notes?`<div class="detail-meta" style="margin-top:6px;font-style:italic">"${esc(c.notes)}"</div>`:''}
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="openScoreModal(${c.id})"><i class="ti ti-plus"></i> เพิ่มคะแนนสัมภาษณ์</button>
          <button class="btn btn-sm" onclick="openCandidateModal(${c.id})"><i class="ti ti-edit"></i> แก้ไข</button>
          <button class="btn btn-sm" onclick="deleteCandidate(${c.id})"><i class="ti ti-trash"></i> ลบ</button>
        </div>
      </div>
      <div class="detail-big-score">
        <div class="n ${v==null?'':(v>=4?'':'')}" style="color:${v==null?'var(--text3)':(v>=4?'var(--green)':v>=3?'var(--amber)':'var(--red)')}">${fmtScore(v)}</div>
        <div class="l">คะแนนเฉลี่ย / 5</div>
        ${rec!=null?`<div style="margin-top:8px"><span class="rec-pill rec-${rec}">${REC_LABEL[rec]}</span></div>`:''}
      </div>
    </div>
    <div class="two-col">
      <div class="panel">
        <h3>ใบให้คะแนน (${cards.length})</h3>
        ${cards.length? cards.map(s=>scorecardHtml(c.id,s)).join('') : '<div class="empty"><i class="ti ti-clipboard"></i>ยังไม่มีใบให้คะแนน<br><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="openScoreModal('+c.id+')">เพิ่มคะแนน</button></div>'}
      </div>
      <div class="panel">
        <h3>คะแนนเฉลี่ยรายเกณฑ์</h3>
        ${CRITERIA.map(cr=>{
          const a=cavg[cr.key]; const pct=a==null?0:(a/5*100);
          const col=a==null?'var(--border)':(a>=4?'var(--green)':a>=3?'var(--amber)':'var(--red)');
          return `<div class="crit-bar-row">
            <div class="crit-bar-top"><span>${cr.name}</span><span class="v">${fmtScore(a)}</span></div>
            <div class="crit-bar"><span style="width:${pct}%;background:${col}"></span></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  document.getElementById('pageTitle').textContent=c.name;
  document.getElementById('pageSub').textContent='รายละเอียดและคะแนนสัมภาษณ์';
  showViewOnly('detail');
}
function showViewOnly(name){
  ['dashboard','candidates','detail'].forEach(v=> document.getElementById('view-'+v).style.display = v===name?'':'none');
  document.querySelectorAll('.nav-item[data-view]').forEach(i=>i.classList.remove('active'));
}

function scorecardHtml(candId,s){
  return `<div class="sc-card">
    <div class="sc-head">
      <div><div class="sc-who">${esc(s.interviewer)}</div><div class="sc-when">${esc(s.round)} · ${fmtDate(s.date)}</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="rec-pill rec-${s.rec}">${REC_LABEL[s.rec]||''}</span>
        <button class="sc-del" title="ลบ" onclick="deleteScorecard(${candId},${s.id})"><i class="ti ti-trash"></i></button>
      </div>
    </div>
    <div class="sc-scores">
      ${CRITERIA.map(cr=>{ const v=s.scores?.[cr.key]; return `<span class="sc-chip">${cr.name} <b>${v??'—'}</b></span>`; }).join('')}
    </div>
    ${s.comment?`<div class="sc-comment">${esc(s.comment)}</div>`:''}
  </div>`;
}

/* ---------------- Candidate modal ---------------- */
function openCandidateModal(id){
  const m=document.getElementById('candModal');
  document.getElementById('candId').value = id||'';
  document.getElementById('candModalTitle').textContent = id? 'แก้ไขผู้สมัคร':'เพิ่มผู้สมัคร';
  const c = id? candidates.find(x=>x.id===id) : null;
  document.getElementById('fName').value=c?.name||'';
  document.getElementById('fPosition').value=c?.position||'';
  document.getElementById('fDept').value=c?.dept||'';
  document.getElementById('fStage').value=c?.stage||'interview';
  document.getElementById('fEmail').value=c?.email||'';
  document.getElementById('fPhone').value=c?.phone||'';
  document.getElementById('fNotes').value=c?.notes||'';
  m.classList.add('open');
}
function saveCandidate(){
  const name=document.getElementById('fName').value.trim();
  const position=document.getElementById('fPosition').value.trim();
  if(!name||!position){ alert('กรุณากรอกชื่อและตำแหน่ง'); return; }
  const id=document.getElementById('candId').value;
  const data={
    name, position,
    dept:document.getElementById('fDept').value.trim(),
    stage:document.getElementById('fStage').value,
    email:document.getElementById('fEmail').value.trim(),
    phone:document.getElementById('fPhone').value.trim(),
    notes:document.getElementById('fNotes').value.trim(),
  };
  if(id){ Object.assign(candidates.find(x=>x.id==id), data); }
  else{ candidates.push({id:nextId(), ...data, createdAt:Date.now(), scorecards:[]}); }
  save(); closeModal('candModal');
  const cur=document.getElementById('view-detail').style.display!=='none' && id;
  if(cur) openDetail(Number(id)); else showView('candidates');
}
function deleteCandidate(id){
  if(!confirm('ลบผู้สมัครคนนี้และคะแนนทั้งหมด?')) return;
  candidates=candidates.filter(c=>c.id!==id); save(); showView('candidates');
}

/* ---------------- Scorecard modal ---------------- */
let scRating={}, scRec=null;
function openScoreModal(candId){
  const c=candidates.find(x=>x.id===candId); if(!c) return;
  document.getElementById('scCandId').value=candId;
  document.getElementById('scoreModalSub').textContent='ผู้สมัคร: '+c.name;
  document.getElementById('scInterviewer').value='';
  document.getElementById('scComment').value='';
  document.getElementById('scRound').selectedIndex=1;
  scRating={}; scRec=null;
  document.getElementById('critRows').innerHTML=CRITERIA.map(cr=>`
    <div class="crit-row">
      <div><div class="crit-name">${cr.name}</div><div class="crit-hint">${cr.hint}</div></div>
      <div class="rating" data-key="${cr.key}">
        ${[1,2,3,4,5].map(n=>`<button type="button" onclick="setRating('${cr.key}',${n})">${n}</button>`).join('')}
      </div>
    </div>`).join('');
  document.querySelectorAll('#recChoices button').forEach(b=>{ b.classList.remove('sel'); b.onclick=()=>setRec(Number(b.dataset.v)); });
  document.getElementById('scoreModal').classList.add('open');
}
function setRating(key,n){
  scRating[key]=n;
  const row=document.querySelector(`.rating[data-key="${key}"]`);
  row.querySelectorAll('button').forEach((b,i)=> b.classList.toggle('sel', i+1<=n));
}
function setRec(v){
  scRec=v;
  document.querySelectorAll('#recChoices button').forEach(b=> b.classList.toggle('sel', Number(b.dataset.v)===v));
}
function saveScorecard(){
  const candId=Number(document.getElementById('scCandId').value);
  const interviewer=document.getElementById('scInterviewer').value.trim();
  if(!interviewer){ alert('กรุณากรอกชื่อผู้สัมภาษณ์'); return; }
  if(Object.keys(scRating).length<CRITERIA.length){ alert('กรุณาให้คะแนนครบทุกเกณฑ์'); return; }
  if(scRec==null){ alert('กรุณาเลือกคำแนะนำ (Recommendation)'); return; }
  const c=candidates.find(x=>x.id===candId);
  c.scorecards=c.scorecards||[];
  c.scorecards.push({
    id:nextId(), interviewer, round:document.getElementById('scRound').value,
    date:Date.now(), scores:{...scRating}, rec:scRec,
    comment:document.getElementById('scComment').value.trim(),
  });
  save(); closeModal('scoreModal'); openDetail(candId);
}
function deleteScorecard(candId,scId){
  if(!confirm('ลบใบให้คะแนนนี้?')) return;
  const c=candidates.find(x=>x.id===candId);
  c.scorecards=c.scorecards.filter(s=>s.id!==scId); save(); openDetail(candId);
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(o=> o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('open'); }));

/* ---------------- Export ---------------- */
function exportCSV(){
  const head=['Candidate','Position','Department','Stage','Interviewer','Round','Date',...CRITERIA.map(c=>c.name),'Avg','Recommendation','Comment'];
  const rows=[head];
  candidates.forEach(c=>{
    if(!(c.scorecards||[]).length){ rows.push([c.name,c.position,c.dept||'',c.stage,'','','',...CRITERIA.map(()=>''),'','','']); return; }
    c.scorecards.forEach(s=>{
      const vals=CRITERIA.map(cr=>s.scores?.[cr.key]??'');
      const nums=vals.filter(v=>v!=='');
      const avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2):'';
      rows.push([c.name,c.position,c.dept||'',c.stage,s.interviewer,s.round,fmtDate(s.date),...vals,avg,REC_LABEL[s.rec]||'',s.comment||'']);
    });
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='hobi-interview-scores-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}

/* ---------------- Theme ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeIcon').className='ti '+(t==='dark'?'ti-sun':'ti-moon');
  document.getElementById('themeLabel').textContent=t==='dark'?'Light mode':'Dark mode';
  try{ localStorage.setItem('hobi-theme',t); }catch(e){}
}
let savedTheme='light'; try{ savedTheme=localStorage.getItem('hobi-theme')||'light'; }catch(e){}
applyTheme(savedTheme);
document.getElementById('themeToggle').onclick=()=> applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---------------- Init ---------------- */
showView('dashboard');
</script>
